<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./media-protection.js"></script>
<link rel="stylesheet" href="./mobile-responsive.css?v=20260825-2">
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f6f1e6; }
    a { color: oklch(0.35 0.01 260); }
    a:hover { color: oklch(0.25 0.01 260); }
    .lang-btn { display: inline-flex; align-items: center; justify-content: center; font-family: Inter, Arial, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; border: 1px dashed oklch(0.4 0.01 260 / 0.7); border-radius: 999px; padding: 14px 32px; color: oklch(0.35 0.01 260); background: transparent; cursor: pointer; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
    .lang-btn:hover { background: oklch(0.15 0 0); color: #fff; border-color: oklch(0.15 0 0); }
    .lang-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; flex: 1; padding: 48px 32px; box-sizing: border-box; }
    .lang-question { margin: 0; font-family: Inter, Arial, sans-serif; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1.3; color: oklch(0.22 0 0); text-align: center; }
    .q-mobile { display: none; max-width: 16ch; }
    .q-desktop { display: block; }
    .lang-wrap { position: fixed; inset: 0; width: 100%; height: 100%; background: #f6f1e6; display: flex; z-index: 1000; }
    .lang-divider { width: 0; align-self: stretch; margin: 64px 0; border-left: 1px dashed oklch(0.25 0 0 / 0.6); flex-shrink: 0; }
    .lang-close { position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid oklch(0.25 0 0 / 0.6); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; z-index: 1001; padding: 0; }
    .lang-close:hover { background: oklch(0.15 0 0); border-color: oklch(0.15 0 0); }
    .lang-close svg { width: 16px; height: 16px; }
    .lang-close:hover svg line { stroke: #fff; }
    @media (max-width: 720px) {
      .lang-wrap { flex-direction: column; }
      .lang-divider { width: auto; height: 0; align-self: stretch; margin: 0 40px; border-left: none; border-top: 1px dashed oklch(0.25 0 0 / 0.6); }
      .q-desktop { display: none; }
      .q-mobile { display: block; }
    }
  </style>
</helmet>

<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
<div class="lang-wrap">
  <button class="lang-close" aria-label="Fechar seletor de idioma" onClick="{{ close }}">
    <svg viewBox="0 0 24 24">
      <line x1="5" y1="5" x2="19" y2="19" stroke="oklch(0.25 0 0)" stroke-width="1.6" stroke-linecap="round"></line>
      <line x1="19" y1="5" x2="5" y2="19" stroke="oklch(0.25 0 0)" stroke-width="1.6" stroke-linecap="round"></line>
    </svg>
  </button>
  <div class="lang-col">
    <p class="lang-question q-desktop">Em qual idioma você<br/>prefere descobrir<br/>coisas novas?</p>
    <p class="lang-question q-mobile">Em qual idioma você prefere descobrir coisas novas?</p>
    <a href="#" class="lang-btn">Português</a>
  </div>
  <div class="lang-divider"></div>
  <div class="lang-col">
    <p class="lang-question q-desktop">Which language do<br/>you prefer to discover<br/>new things in?</p>
    <p class="lang-question q-mobile">Which language do you prefer to discover new things in?</p>
    <a href="#" class="lang-btn">English</a>
  </div>
</div>
</sc-if>

<div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Inter, Arial, sans-serif; color: oklch(0.4 0.01 260); font-size: 14px;">Pagina por tras do seletor</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: true };
  close = () => this.setState({ open: false });
  renderVals() {
    return { open: this.state.open, close: this.close };
  }
}
</script>
</body>
</html>
